<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RankRun</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #10131a;
color: white;
text-align: center;
}

.container {
max-width: 700px;
margin: auto;
padding: 25px;
}

h1 {
font-size: 42px;
margin-bottom: 5px;
}

.subtitle {
color: #aaa;
margin-bottom: 25px;
}

.card {
background: #1b202b;
border-radius: 20px;
padding: 25px;
margin-bottom: 20px;
}

.rank {
font-size: 32px;
font-weight: bold;
margin: 10px 0;
}

.hiddenRank {
color: #aaa;
}

.timer {
font-size: 75px;
font-weight: bold;
margin: 25px 0;
}

button {
border: none;
border-radius: 12px;
padding: 13px 22px;
margin: 5px;
font-size: 17px;
font-weight: bold;
cursor: pointer;
}

.start {
background: white;
color: black;
}

.reset {
background: #8b2020;
color: white;
}

.rankList {
text-align: left;
}

.rankRow {
display: flex;
justify-content: space-between;
padding: 10px;
border-bottom: 1px solid #303644;
font-weight: bold;
}

/* Rank Colors */

.bronze {
color: #a0522d;
}

.silver {
color: silver;
}

.gold {
color: #ffd700;
}

.platinum {
color: #87ceeb;
}

.diamond {
color: #174ea6;
}

.elite {
color: #32cd32;
}

.champion {
background: linear-gradient(90deg, white, #ff69b4, white);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.olympian {
background: linear-gradient(90deg, #ff3030, #ffd700, white, #ffd700, #ff3030);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.current {
background: #292f3c;
border-radius: 8px;
}

.small {
color: #aaa;
font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>RankRun</h1>

<div class="subtitle">
Race your way from Bronze to Olympian.
</div>

<div class="card">

<div>Current Rank</div>

<div id="rank" class="rank hiddenRank">
???
</div>

<div id="target">
Target: 30 minutes
</div>

<div id="timer" class="timer">
00:00
</div>

<button class="start" onclick="startTimer()">START</button>

<button onclick="pauseTimer()">PAUSE</button>

<button class="reset" onclick="resetTimer()">RESET</button>

</div>

<div class="card">

<h2>Rank Progression</h2>

<div id="rankList" class="rankList"></div>

</div>

</div>

<script>

const ranks = [
["Bronze I", 30, "bronze"],
["Bronze II", 29, "bronze"],
["Bronze III", 28, "bronze"],

["Silver I", 27, "silver"],
["Silver II", 26, "silver"],
["Silver III", 25, "silver"],

["Gold I", 24, "gold"],
["Gold II", 23, "gold"],
["Gold III", 22, "gold"],

["Platinum I", 21, "platinum"],
["Platinum II", 20, "platinum"],
["Platinum III", 19, "platinum"],

["Diamond I", 18, "diamond"],
["Diamond II", 17, "diamond"],
["Diamond III", 16, "diamond"],

["Elite I", 15, "elite"],
["Elite II", 14, "elite"],
["Elite III", 13, "elite"],

["Champion I", 12, "champion"],
["Champion II", 11.5, "champion"],
["Champion III", 11, "champion"],

["Olympian", 10, "olympian"]
];

let rankIndex = 0;
let seconds = 0;
let running = false;
let interval;

function updateScreen() {

let currentRank = ranks[rankIndex];

document.getElementById("rank").innerText = "???";

document.getElementById("target").innerText =
"Target: " + currentRank[1] + " minutes";

let minutes = Math.floor(seconds / 60);
let secs = Math.floor(seconds % 60);

document.getElementById("timer").innerText =
String(minutes).padStart(2, "0") + ":" +
String(secs).padStart(2, "0");

createRankList();
}

function revealRank() {

let currentRank = ranks[rankIndex];

let rankElement = document.getElementById("rank");

rankElement.innerText = currentRank[0];

rankElement.className = "rank " + currentRank[2];
}

function createRankList() {

let list = "";

for (let i = 0; i < ranks.length; i++) {

let current = i === rankIndex ? "current" : "";

list += `
<div class="rankRow ${current} ${ranks[i][2]}">
<span>${ranks[i][0]}</span>
<span>${ranks[i][1]} min</span>
</div>
`;
}

document.getElementById("rankList").innerHTML = list;
}

function startTimer() {

if (running) return;

running = true;

interval = setInterval(function() {

seconds++;

let targetSeconds = ranks[rankIndex][1] * 60;

if (seconds >= targetSeconds) {

if (rankIndex < ranks.length - 1) {

revealRank();

alert(
"RANK COMPLETE!\nYou reached " +
ranks[rankIndex][0] + "!"
);

rankIndex++;
seconds = 0;

updateScreen();

} else {

revealRank();

running = false;
clearInterval(interval);

alert("🏆 YOU REACHED OLYMPIAN!");

}

}

updateScreen();

}, 1000);
}

function pauseTimer() {

running = false;
clearInterval(interval);

}

function resetTimer() {

running = false;
clearInterval(interval);

seconds = 0;
rankIndex = 0;

document.getElementById("rank").innerText = "???";
document.getElementById("rank").className = "rank hiddenRank";

updateScreen();

}

updateScreen();

</script>

</body>
</html>
