<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RankRun</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #10131a;
color: white;
text-align: center;
}

.container {
max-width: 700px;
margin: auto;
padding: 25px;
}

h1 {
font-size: 42px;
margin-bottom: 5px;
}

.subtitle {
color: #aaa;
margin-bottom: 25px;
}

.card {
background: #1b202b;
border-radius: 20px;
padding: 25px;
margin-bottom: 20px;
position: relative;
}

.prBadge {
position: absolute;
top: 15px;
right: 15px;
background: #292f3c;
border-radius: 12px;
padding: 8px 14px;
text-align: right;
font-size: 13px;
cursor: pointer;
}

.prBadge .prLabel {
color: #aaa;
font-size: 11px;
margin-bottom: 3px;
}

.prBadge .prRank {
font-weight: bold;
font-size: 15px;
}

.prBadge .prTime {
font-size: 13px;
color: #ddd;
}

.prBadge .prDeleteHint {
font-size: 10px;
color: #d66;
margin-top: 4px;
}

.rank {
font-size: 32px;
font-weight: bold;
margin: 10px 0;
}

.hiddenRank {
color: #aaa;
}

.timer {
font-size: 75px;
font-weight: bold;
margin: 25px 0;
}

button {
border: none;
border-radius: 12px;
padding: 13px 22px;
margin: 5px;
font-size: 17px;
font-weight: bold;
cursor: pointer;
}

.start {
background: white;
color: black;
}

.finish {
background: #2a7a3b;
color: white;
}

.reset {
background: #8b2020;
color: white;
}

.rankList {
text-align: left;
}

.rankRow {
display: flex;
justify-content: space-between;
padding: 10px;
border-bottom: 1px solid #303644;
font-weight: bold;
}

/* Rank Colors */

.bronze {
color: #a0522d;
}

.silver {
color: silver;
}

.gold {
color: #ffd700;
}

.platinum {
color: #87ceeb;
}

.diamond {
color: #174ea6;
}

.elite {
color: #32cd32;
}

.champion {
background: linear-gradient(90deg, white, #ff69b4, white);
background-clip: text;
-webkit-background-clip: text;
color: transparent;
-webkit-text-fill-color: transparent;
}

.olympian {
background: linear-gradient(90deg, #ff3030, #ffd700, white, #ffd700, #ff3030);
background-clip: text;
-webkit-background-clip: text;
color: transparent;
-webkit-text-fill-color: transparent;
}

.current {
background: #292f3c;
border-radius: 8px;
}

.small {
color: #aaa;
font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1>RankRun</h1>

<div class="subtitle">
Run your two miles. Pause when you finish. Chase your PR.
</div>

<div class="card">

<div class="prBadge" id="prBadge" onclick="deletePR()">
<div class="prLabel">YOUR PR</div>
<div class="prRank" id="prRankText">None yet</div>
<div class="prTime" id="prTimeText">--:--</div>
<div class="prDeleteHint" id="prDeleteHint"></div>
</div>

<div>Current Result</div>

<div id="rank" class="rank hiddenRank">
???
</div>

<div id="timer" class="timer">
00:00
</div>

<button class="start" onclick="startTimer()">START</button>

<button onclick="pauseTimer()">PAUSE</button>

<button class="finish" onclick="finishRun()">FINISH</button>

<button class="reset" onclick="resetTimer()">RESET</button>

</div>

<div class="card">

<h2>Rank Thresholds</h2>

<div id="rankList" class="rankList"></div>

</div>

</div>

<script>

// Each rank represents a two-mile time in minutes.
// Faster time = better rank. List is ordered slowest to fastest.
const ranks = [
["Bronze I", 30, "bronze"],
["Bronze II", 29, "bronze"],
["Bronze III", 28, "bronze"],

["Silver I", 27, "silver"],
["Silver II", 26, "silver"],
["Silver III", 25, "silver"],

["Gold I", 24, "gold"],
["Gold II", 23, "gold"],
["Gold III", 22, "gold"],

["Platinum I", 21, "platinum"],
["Platinum II", 20, "platinum"],
["Platinum III", 19, "platinum"],

["Diamond I", 18, "diamond"],
["Diamond II", 17, "diamond"],
["Diamond III", 16, "diamond"],

["Elite I", 15, "elite"],
["Elite II", 14, "elite"],
["Elite III", 13, "elite"],

["Champion I", 12, "champion"],
["Champion II", 11.5, "champion"],
["Champion III", 11, "champion"],

["Olympian", 10, "olympian"]
];

let seconds = 0;
let running = false;
let interval;

// PR history: a list of all finish times (in seconds), stored across
// sessions in this browser. The current PR is always the fastest time
// in this list. Deleting a PR removes just that one time, and the
// next best one automatically becomes the new PR.
let prHistory = loadPRHistory();

function loadPRHistory() {
let saved = localStorage.getItem("rankRunPRHistory");
if (saved) {
try {
let parsed = JSON.parse(saved);
if (Array.isArray(parsed)) return parsed;
} catch (e) {}
}

// Migrate the old single-PR storage so nobody loses their existing PR.
let oldPR = localStorage.getItem("rankRunPR");
if (oldPR) {
return [parseFloat(oldPR)];
}

return [];
}

function savePRHistory() {
localStorage.setItem("rankRunPRHistory", JSON.stringify(prHistory));
}

function getCurrentPR() {
if (prHistory.length === 0) return null;
return Math.min(...prHistory);
}

// Given a time in seconds, find the best rank achieved (fastest
// threshold that the time is equal to or faster than).
function getRankForTime(timeSeconds) {
let timeMinutes = timeSeconds / 60;
let achieved = null;

for (let i = 0; i < ranks.length; i++) {
if (timeMinutes <= ranks[i][1]) {
achieved = ranks[i];
}
}

return achieved;
}

function formatTime(totalSeconds) {
let minutes = Math.floor(totalSeconds / 60);
let secs = Math.floor(totalSeconds % 60);
return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}

function updateScreen() {
document.getElementById("timer").innerText = formatTime(seconds);
updatePRBadge();
createRankList();
}

function updatePRBadge() {
let rankTextEl = document.getElementById("prRankText");
let timeTextEl = document.getElementById("prTimeText");
let hintEl = document.getElementById("prDeleteHint");

let prSeconds = getCurrentPR();

if (prSeconds === null) {
rankTextEl.innerText = "None yet";
rankTextEl.className = "prRank";
timeTextEl.innerText = "--:--";
hintEl.innerText = "";
} else {
let prRank = getRankForTime(prSeconds);
rankTextEl.innerText = prRank ? prRank[0] : "Unranked";
rankTextEl.className = "prRank " + (prRank ? prRank[2] : "");
timeTextEl.innerText = formatTime(prSeconds);
hintEl.innerText = "tap to delete";
}
}

function deletePR() {
let prSeconds = getCurrentPR();

if (prSeconds === null) {
alert("You don't have a PR yet, nothing to delete!");
return;
}

let prRank = getRankForTime(prSeconds);
let rankName = prRank ? prRank[0] : "Unranked";

let confirmed = confirm(
"Delete your current PR?\n" +
rankName + " - " + formatTime(prSeconds) +
"\n\nThis can't be undone."
);

if (!confirmed) return;

// Remove just ONE occurrence of this time, in case the same time
// happened twice. The next best time in history becomes the new PR.
let indexToRemove = prHistory.indexOf(prSeconds);
if (indexToRemove !== -1) {
prHistory.splice(indexToRemove, 1);
savePRHistory();
updatePRBadge();

let newPR = getCurrentPR();
if (newPR === null) {
alert("PR deleted. You don't have any recorded times left.");
} else {
let newRank = getRankForTime(newPR);
alert("PR deleted. Your PR is now " + (newRank ? newRank[0] : "Unranked") + " - " + formatTime(newPR) + ".");
}
}
}

function createRankList() {
let currentRank = getRankForTime(seconds);

let list = "";

for (let i = 0; i < ranks.length; i++) {
let isCurrent = currentRank && ranks[i][0] === currentRank[0] ? "current" : "";

// The color class goes on the text spans, NOT the row, so the
// "current" highlight background can't wipe out the gradient text.
list += `
<div class="rankRow ${isCurrent}">
<span class="${ranks[i][2]}">${ranks[i][0]}</span>
<span class="${ranks[i][2]}">${ranks[i][1]} min</span>
</div>
`;
}

document.getElementById("rankList").innerHTML = list;
}

function startTimer() {
if (running) return;

running = true;

interval = setInterval(function() {
seconds++;
updateScreen();
}, 1000);
}

function pauseTimer() {
running = false;
clearInterval(interval);
}

function finishRun() {
pauseTimer();

let resultRank = getRankForTime(seconds);
let rankElement = document.getElementById("rank");

// Every finish gets saved to history (even ones that don't hit a rank),
// so a bad run can always be deleted later.
let previousPR = getCurrentPR();
let isNewPR = previousPR === null || seconds < previousPR;

prHistory.push(seconds);
savePRHistory();
updatePRBadge();

if (!resultRank) {
rankElement.innerText = "No rank yet";
rankElement.className = "rank hiddenRank";
alert("That time didn't hit Bronze I yet. Keep training!");
return;
}

rankElement.innerText = resultRank[0];
rankElement.className = "rank " + resultRank[2];

if (isNewPR) {
alert("RANK UP! New PR!\nYou reached " + resultRank[0] + " with a time of " + formatTime(seconds) + "!");
} else {
alert("Result: " + resultRank[0] + "\nTime: " + formatTime(seconds) + "\nYour PR is still " + formatTime(previousPR) + ".");
}
}

function resetTimer() {
running = false;
clearInterval(interval);

seconds = 0;

document.getElementById("rank").innerText = "???";
document.getElementById("rank").className = "rank hiddenRank";

updateScreen();
}

updateScreen();

</script>

</body>
</html>
